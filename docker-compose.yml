services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: outreach_db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_dev}
      POSTGRES_DB: ${POSTGRES_DB:-outreach_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: outreach_redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_celery
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_celery_beat
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app beat --loglevel=info

  # Landing Page (Next.js)
  landing:
    build:
      context: ./landing page
      dockerfile: Dockerfile
    container_name: outreach_landing
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    volumes:
      - ./landing page:/app
      - landing_node_modules:/app/node_modules
    command: npm run dev -- -H 0.0.0.0 -p 3000

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outreach_frontend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- -H 0.0.0.0 -p 3000

  gateway:
    image: nginx:alpine
    container_name: outreach_gateway
    restart: unless-stopped
  
    depends_on:
      - landing
      - frontend
      - backend
  
    ports:
      - "80:80"
      - "443:443"
  
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro


volumes:
  postgres_data:
  frontend_node_modules:
  landing_node_modules:
