services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: outreach_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_dev}
      POSTGRES_DB: ${POSTGRES_DB:-outreach_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: outreach_redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev}@db:5432/${POSTGRES_DB:-outreach_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CALENDLY_WEBHOOK_SECRET=${CALENDLY_WEBHOOK_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_DRAFT=${OPENAI_MODEL_DRAFT:-gpt-4o-mini}
      - OPENAI_MODEL_LINT=${OPENAI_MODEL_LINT:-gpt-4o-mini}
      - OPENAI_MODEL_CLASSIFY=${OPENAI_MODEL_CLASSIFY:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_celery
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev}@db:5432/${POSTGRES_DB:-outreach_db}
      - REDIS_URL=redis://redis:6379/0
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_DRAFT=${OPENAI_MODEL_DRAFT:-gpt-4o-mini}
      - OPENAI_MODEL_LINT=${OPENAI_MODEL_LINT:-gpt-4o-mini}
      - OPENAI_MODEL_CLASSIFY=${OPENAI_MODEL_CLASSIFY:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_celery_beat
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach_dev}@db:5432/${POSTGRES_DB:-outreach_db}
      - REDIS_URL=redis://redis:6379/0
      - OAUTH_ENCRYPTION_KEY=${OAUTH_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_DRAFT=${OPENAI_MODEL_DRAFT:-gpt-4o-mini}
      - OPENAI_MODEL_LINT=${OPENAI_MODEL_LINT:-gpt-4o-mini}
      - OPENAI_MODEL_CLASSIFY=${OPENAI_MODEL_CLASSIFY:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app beat --loglevel=info

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outreach_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL:-http://localhost:8000}
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules:
