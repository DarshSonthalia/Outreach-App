# -------------------------------
# HTTP → HTTPS redirect
# -------------------------------
server {
  listen 80;
  server_name intently-ai.com www.intently-ai.com;

  return 301 https://$host$request_uri;
}

# -------------------------------
# HTTPS server (main)
# -------------------------------
server {
  listen 443 ssl;
  server_name intently-ai.com www.intently-ai.com;

  client_max_body_size 10m;

  ssl_certificate /etc/letsencrypt/live/intently-ai.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/intently-ai.com/privkey.pem;

  # -------------------------------
  # APP (Next.js at /app)
  # -------------------------------
  location /app/ {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /app {
    return 301 /app/;
  }

  location ~ ^/wizard(/.*)?$ {
    return 301 /app/wizard$1$is_args$args;
  }

  # -------------------------------
  # API (backend)
  # -------------------------------
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # -------------------------------
  # LANDING PAGE
  # -------------------------------
  location / {
    proxy_pass http://landing:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
